    min_bound: 0.0
    max_bound: 100.0
    default_exposure: 0.6
  E04:
    name: "공정가스 감축률"
    min_bound: 0.0
    max_bound: 100.0
    default_exposure: 0.7
  E05:
    name: "유해화학물질 배출량"
    min_bound: 0.0
    max_bound: 2000.0
    default_exposure: 0.8
  S01:
    name: "산업재해율(LTIR)"
    min_bound: 0.0
