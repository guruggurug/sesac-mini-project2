# Uncertainty penalties for data confidence / completeness calculations
uncertainty_penalties:
  scope_mismatch: 0.08
  period_mismatch_1y: 0.03
  period_mismatch_2y: 0.05
  no_assurance: 0.03
  non_official_source: 0.05
  missing_quantitative_value: 0.07
