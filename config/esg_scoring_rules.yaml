  S04:
    name: "정보보호 관리 수준"
    min_bound: 0.0
    max_bound: 100.0
    default_exposure: 0.7
  G01:
    name: "사외이사 비율"
    min_bound: 0.0
    max_bound: 100.0
    default_exposure: 0.5
  G02:
    name: "정정공시 건수"
    min_bound: 0.0
    max_bound: 10.0
    default_exposure: 0.6
  G03:
