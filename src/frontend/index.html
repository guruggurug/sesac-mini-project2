<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반도체 가치투자 내비게이션</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="mobile-container" id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-area">
                <span class="logo-icon">⚡</span>
                <h1 class="logo-title">Antigravity NAV</h1>
            </div>
            <span class="data-badge badge-sample" id="data-status-badge">Sample Data</span>
        </header>

        <!-- Main Dashboard View -->
        <main class="app-main">
            <!-- App Description/Alert -->
            <section class="info-banner">
                <p>💡 삼성전자와 SK하이닉스의 ESG 관리위험 및 가격 하방위험(CVaR 95%)을 비교 분석하여 위험을 줄이는 최적의 포트폴리오 비중을 제안합니다.</p>
            </section>

            <!-- Input Form Section -->
            <section class="card form-card">
                <h2 class="section-title">📥 내 포트폴리오 입력</h2>
                <form id="portfolio-form" class="portfolio-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="samsung-shares">삼성전자 보유 수량</label>
                            <input type="number" id="samsung-shares" placeholder="0" min="0" required>
                        </div>
                        <div class="form-group">
                            <label for="samsung-price">삼성전자 평단가 (원)</label>
                            <input type="number" id="samsung-price" placeholder="0" min="0" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="hynix-shares">SK하이닉스 보유 수량</label>
                            <input type="number" id="hynix-shares" placeholder="0" min="0" required>
                        </div>
                        <div class="form-group">
                            <label for="hynix-price">SK하이닉스 평단가 (원)</label>
                            <input type="number" id="hynix-price" placeholder="0" min="0" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary" id="btn-submit">포트폴리오 진단하기</button>
                </form>
            </section>

            <!-- Results Section (Hidden initially or showing placeholder) -->
            <section class="results-container" id="results-area">
                <!-- Status Placeholders -->
                <div class="empty-state" id="empty-state">
                    <div class="empty-icon">📊</div>
                    <p>포트폴리오 정보를 입력하고 진단하기 버튼을 눌러주세요.</p>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p class="disclaimer">⚠️ 본 서비스에서 제공하는 결과는 투자 참고용이며, 투자 자문이나 매매 지시가 아닙니다. 모든 투자의 책임은 본인에게 있습니다.</p>
            <p class="copyright">&copy; 2026 Semiconductor Value Investing Navigation MVP</p>
        </footer>
    </div>
    <script src="index.js"></script>
</body>
</html>
