<!DOCTYPE html>
<html class="light" lang="ko">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>로그인 - Chip Buddy</title>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/index.css">
</head>
<body data-ui-screen="login" class="bg-[#FAF8F5] text-on-surface flex justify-center items-start min-h-screen">
    {% if data_status in ["sample", "fallback"] %}<div class="fixed top-1 right-2 z-[100] rounded-full bg-[#F5E8DD] px-2 py-1 text-[10px] font-bold text-[#964B00]">{{ "샘플 데이터" if data_status == "sample" else "대체 데이터" }}</div>{% endif %}

    <!-- 390px Mobile App Container Shell -->
    <div class="w-full max-w-[390px] min-h-screen flex flex-col justify-between relative shadow-2xl bg-[#FAF8F5] overflow-x-hidden px-6 py-12">

        <!-- Top Spacer to push logo down -->
        <div class="h-10"></div>

        <!-- Title & Subtitle Section -->
        <div class="text-center flex flex-col items-center">
            <h1 class="text-[44px] font-bold text-[#6B3E08] tracking-tight leading-none mb-3">Chip Buddy</h1>
            <p class="text-[14px] font-medium text-[#7A7571] tracking-wide">당신의 투자 친구, Chip Buddy</p>
        </div>

        <!-- Form Fields Section -->
        <form action="/login" method="POST" class="flex flex-col gap-3 mt-10">
            <!-- Username/Email Input -->
            <div class="relative group">
                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#7A7571] group-focus-within:text-primary transition-colors">mail</span>
                <input type="text" name="username" placeholder="이메일 또는 아이디" required class="w-full h-[64px] pl-12 pr-4 bg-white border border-[#E5DEC9] rounded-xl text-[15px] text-[#2A1800] placeholder-[#B5B0AB] focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm">
            </div>

            <!-- Password Input -->
            <div class="relative group">
                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#7A7571] group-focus-within:text-primary transition-colors">lock</span>
                <input type="password" name="password" id="password-input" placeholder="비밀번호" required class="w-full h-[64px] pl-12 pr-12 bg-white border border-[#E5DEC9] rounded-xl text-[15px] text-[#2A1800] placeholder-[#B5B0AB] focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all shadow-sm">
                <button type="button" onclick="togglePasswordVisibility()" id="password-toggle" class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-[#7A7571] hover:text-primary transition-colors focus:outline-none">visibility_off</button>
            </div>

            <!-- Keep me logged in Checkbox -->
            <div class="flex items-center gap-2.5 mt-1.5 px-0.5">
                <input type="checkbox" id="keep-login" class="w-5 h-5 rounded border-[#E5DEC9] text-[#964B00] focus:ring-[#964B00] bg-white cursor-pointer">
                <label for="keep-login" class="text-[13px] font-semibold text-[#564334] cursor-pointer select-none">로그인 상태 유지</label>
            </div>

            <!-- Action Buttons Section -->
            <div class="flex flex-col gap-3 mt-6">
                <!-- Email Login Button -->
                <button type="submit" class="w-full h-14 bg-[#8A4500] text-white font-bold rounded-xl text-[16px] active:scale-[0.98] transition-transform flex items-center justify-center shadow-md shadow-[#8A4500]/10">
                    로그인
                </button>
            </div>
        </form>

        <!-- Demo account hint (presentation convenience) -->
        <p class="text-center text-[12px] text-[#B5A38F] mt-4">데모 계정: demo_user / demo1234</p>

        <!-- Footer Links -->
        <nav class="flex items-center justify-center gap-3 mt-8 text-[13px] text-[#7A7571]">
            <a class="hover:text-primary transition-colors" href="#">아이디 찾기</a>
            <span class="text-[#E5DEC9]">&bull;</span>
            <a class="hover:text-primary transition-colors" href="#">비밀번호 찾기</a>
            <span class="text-[#E5DEC9]">&bull;</span>
            <a class="hover:text-primary transition-colors font-semibold text-[#6B3E08]" href="#">회원가입</a>
        </nav>

        <!-- Bottom Spacer to balance the top -->
        <div class="h-6"></div>

    </div>

    <!-- Password visibility toggle script -->
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password-input');
            const passwordToggle = document.getElementById('password-toggle');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordToggle.innerText = 'visibility';
            } else {
                passwordInput.type = 'password';
                passwordToggle.innerText = 'visibility_off';
            }
        }
    </script>
</body>
</html>
