<span class="text-label-md font-label-md text-on-surface-variant" style="font-weight: 500; font-size: 12px; color: rgb(122, 117, 113);">005930</span>
</div>
</div>
<div class="grid grid-cols-1 gap-4">
<div>
<label class="font-label-md text-label-md text-on-surface-variant uppercase mb-1 block" style="font-weight: 500; font-size: 12px; color: rgb(122, 117, 113);">수량 (주)</label>

<div>

<div class="flex gap-2">

</div>

<!-- Purchase Reason Section -->

<!-- Investment Propensity Section -->
<section class="p-4 mt-2">

<div class="grid grid-cols-3 gap-2">

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">analytics</span>
                수정 완료 및 진단받기
            </button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[390px] bg-[#FAF8F5] border-t border-[#E5DEC9] z-50 h-16 grid grid-cols-4 items-center">
<!-- Tab 1: 홈 -->
<button class="flex flex-col items-center justify-center text-[#8A8A8A] h-full">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium mt-1">홈</span>
</button>
<!-- Tab 2: 진단/최적화 (Active) -->
<div class="flex justify-center items-center h-full">
<button class="flex flex-col items-center justify-center bg-[#F5E8DD] text-primary rounded-full px-4 py-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">analytics</span>
<span class="text-[10px] font-bold mt-1" style="color: rgb(150, 75, 0);">진단/최적화</span>
</button>
</div>
<!-- Tab 3: 이슈 분석 -->

</button>
<!-- Tab 4: 설정 -->

<span class="material-symbols-outlined">settings</span>

</button>

</div>
<script>
        // Interactive state handlers
        document.querySelectorAll('.flex.flex-wrap.gap-2 button').forEach(button => {
            button.addEventListener('click', () => {
                const isActive = button.classList.contains('bg-primary');
                if (isActive) {
                    button.classList.remove('bg-primary', 'text-white', 'font-bold', 'shadow-sm');
                    button.classList.add('bg-white', 'text-on-surface', 'border-[#E5DEC9]');
                } else {
                    button.classList.add('bg-primary', 'text-white', 'font-bold', 'shadow-sm');
                    button.classList.remove('bg-white', 'text-on-surface', 'border-[#E5DEC9]');
                }
            });
        });

        const propensityButtons = document.querySelectorAll('.grid.grid-cols-3 button');
        propensityButtons.forEach(button => {
            button.addEventListener('click', () => {
                propensityButtons.forEach(btn => {
                    btn.classList.remove('border-2', 'border-primary', 'bg-primary', 'text-white', 'font-bold', 'shadow-md');
                    btn.classList.add('border', 'border-[#E5DEC9]', 'bg-white', 'text-on-surface');
                });
                button.classList.remove('border', 'border-[#E5DEC9]', 'bg-white', 'text-on-surface');
                button.classList.add('border-2', 'border-primary', 'bg-primary', 'text-white', 'font-bold', 'shadow-md');
            });
        });
    </script>
